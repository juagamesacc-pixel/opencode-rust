[package]
name = "core"
version = "1.18.30"
edition = "2021"
description = "Rust port of @opencode-ai/core @ v1.18.30 commit 3104c14"
license = "MIT"

[lib]
name = "core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schema = { path = "../schema" }
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
