[package]
name = "tui"
version = "1.18.30"
edition = "2021"
license = "MIT"
description = "Rust port of @opencode-ai/tui v1.18.30 — exact 1:1 clone (SolidJS/OpenTUI → ratatui)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
