[package]
name = "effect-drizzle-sqlite"
version = "1.18.30"
edition = "2021"
description = "Rust port of @opencode-ai/effect-drizzle-sqlite @ v1.18.30 commit 3104c14"
license = "MIT"

[lib]
name = "effect_drizzle_sqlite"
